<div class="container">
  <p class="section-eyebrow">Portfólio</p>
  <h2>Projetos desenvolvidos</h2>

  <ul class="projects-grid">
    @for (item of arrayProjects(); track item.title) {
    <li>
      <button (click)="openDialog(item)" [attr.aria-label]="'Ver detalhes do projeto ' + item.title">
        <span class="project-card__top">
          <span class="project-card__badge">{{ item.title.charAt(0) }}</span>
          <span class="project-card__arrow" aria-hidden="true"></span>
        </span>
        <span class="project-card__title">{{ item.title }}</span>
        <span class="project-card__cta">Ver detalhes</span>
      </button>
    </li>
    }
  </ul>
</div>
