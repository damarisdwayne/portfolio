<div class="container" *transloco="let t">
  <p class="section-eyebrow">{{ t('experiences.eyebrow') }}</p>
  <h2>{{ t('experiences.title') }}</h2>

  <div class="timeline">
    @for (key of arrayExperiences(); track key) {
    <details class="timeline__item">
      <summary>
        <div class="timeline__head">
          <strong>{{ t('experiences.' + key + '.role') }}</strong>
          <span>{{ t('experiences.' + key + '.period') }}</span>
        </div>
        <span class="timeline__chevron" aria-hidden="true"></span>
      </summary>
      <article [innerHTML]="t('experiences.' + key + '.text')"></article>
    </details>
    }
  </div>
</div>
