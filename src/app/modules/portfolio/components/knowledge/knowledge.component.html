<div class="container" *transloco="let t">
  <p class="section-eyebrow">{{ t('knowledge.eyebrow') }}</p>
  <h2>{{ t('knowledge.title') }}</h2>
  <ul>
    @for (item of arrayKnowledge(); track item.name) {
    <li>
      <img
        [src]="item.src"
        [alt]="item.alt"
        loading="lazy"
        width="28"
        height="28"
      />
      <span>{{ item.name }}</span>
    </li>
    }
  </ul>
</div>
